[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-geometry"
version = "0.1.0"
description = "Controlled experiments on thin-feature preservation in neural implicit geometry."
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.26,<3", "matplotlib>=3.8", "scikit-image>=0.23"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["neural_geometry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
